name: MatGraph Extractor CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate XML Research Dataset
        run: python scripts/generate_sample_xmls.py

      - name: Execute Knowledge Mining Pipeline
        run: python scripts/process_papers.py

      - name: Train ML Property Models
        run: python models/train_property_predictor.py

      - name: Run Automated Test Suite
        run: python -m unittest discover -s tests -p "test_*.py"
